<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="XERA — Futuristic, AI-Powered Content and Experience Platform."
>

<title>XERA | Experience What's Next</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<!-- XERA CSS -->
<link
    rel="stylesheet"
    href="css/reset.css"
>

<link
    rel="stylesheet"
    href="css/variables.css"
>

<link
    rel="stylesheet"
    href="css/global.css"
>

<link
    rel="stylesheet"
    href="css/components.css"
>

<link
    rel="stylesheet"
    href="css/responsive.css"
>

</head><body class="theme-dark"><!-- Ambient Background -->
<div
    id="ambient-canvas"
    class="ambient-canvas"
    aria-hidden="true"
>

    <div class="aurora-glow"></div>

    <div class="pulse-grid"></div>

</div>


<!-- XERA Application Shell -->
<div
    id="app"
    class="app-shell"
>

    <!-- Navigation -->
    <header
        id="main-header"
        class="header-nav"
    ></header>


    <!-- Main Landing Content -->
    <main
        id="router-view"
        class="main-content"
    >

        <section class="hero-section">

            <!-- XERA Brand -->
            <div class="hero-brand">


                <!-- =========================================
                XERA SIGNATURE LOADING MARK
                ========================================= -->

                <div
                    class="xera-loader"
                    role="status"
                    aria-label="XERA loading"
                >

                    <div class="x-mark">


                        <!-- Main Modified X -->
                        <div class="x-core">

                            <!-- Left Upper Shard -->
                            <span class="x-shard shard-1"></span>

                            <!-- Right Upper Shard -->
                            <span class="x-shard shard-2"></span>

                            <!-- Left Lower Shard -->
                            <span class="x-shard shard-3"></span>

                            <!-- Right Lower Shard -->
                            <span class="x-shard shard-4"></span>


                            <!-- Inner Digital Cut -->
                            <span class="x-cut cut-1"></span>

                            <span class="x-cut cut-2"></span>

                        </div>


                        <!-- Cyan Ghost X -->
                        <div
                            class="x-ghost x-ghost-cyan"
                            aria-hidden="true"
                        >
                            <span></span>
                        </div>


                        <!-- Violet Ghost X -->
                        <div
                            class="x-ghost x-ghost-violet"
                            aria-hidden="true"
                        >
                            <span></span>
                        </div>


                        <!-- Digital Glitch Fragments -->
                        <div
                            class="x-glitch-fragments"
                            aria-hidden="true"
                        >

                            <i class="fragment fragment-1"></i>

                            <i class="fragment fragment-2"></i>

                            <i class="fragment fragment-3"></i>

                            <i class="fragment fragment-4"></i>

                            <i class="fragment fragment-5"></i>

                            <i class="fragment fragment-6"></i>

                        </div>


                    </div>

                </div>


                <!-- Brand Name -->
                <h1 class="brand-title">
                    XERA
                </h1>


                <!-- Tagline -->
                <p class="brand-tagline">
                    Experience What's Next.
                </p>

            </div>


            <!-- Main Actions -->
            <div class="hero-actions">

                <a
                    href="pages/app.html"
                    class="btn btn-primary"
                >
                    Enter XERA
                </a>


                <a
                    href="pages/app.html#explore"
                    class="btn btn-secondary"
                >
                    Explore
                </a>

            </div>

        </section>

    </main>

</div>


<!-- XERA Application Bootstrap -->
<script
    type="module"
    src="js/app.js"
></script>

</body></html>
